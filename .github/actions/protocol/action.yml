name: protocol
description: The pinned chatkord-protocol submodule, fetched with a token that may read it and left in no git config.
inputs:
  token:
    description: A token that may read chatkord/chatkord-protocol.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')"
        git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --depth 1
