# The git hooks (`mise run hooks` installs them). Each refuses with the rule it broke.
pre-commit:
  commands:
    # What is committed, which the tree's checks below cannot tell from what is not.
    privacy:
      run: bash scripts/gate/pinned.sh && bash protocol/scripts/privacy/run.sh --staged
    fast:
      run: mise run gate:fast
    # What gate:fast leaves to the gate, as it builds: clippy over the packages the commit touches and their dependents.
    clippy:
      run: bash scripts/gate/clippy-touched.sh
# The tip of each ref pushed passed the gate whole (protocol/scripts/gate/record.py).
pre-push:
  commands:
    gated:
      use_stdin: true
      run: bash scripts/gate/pinned.sh && bash protocol/scripts/gate/pushed.sh
commit-msg:
  commands:
    subject:
      run: bash scripts/gate/pinned.sh && bash protocol/scripts/hooks/commit-msg.sh {1}
