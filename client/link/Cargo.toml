[package]
name = "link"
edition = "2024"
publish = false
license.workspace = true
description = "The client's connection to a Chatkord server's /v1 socket: hello, sign-in, requests, events"

[dependencies]
proto.workspace = true
report.workspace = true
terms = { path = "../terms" }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
futures-util = { workspace = true, features = ["sink"] }
# TLS 1.2 is compiled in for a link preview's page alone; a server's configuration names TLS 1.3 only.
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.16.0"
# The operating system's own verifier (MIT OR Apache-2.0): Windows' CertGetCertificateChain, rustls-native-certs
# on Linux.
rustls-platform-verifier = "0.7.1"
# The certificate parser rustls verifies with, for a key's SubjectPublicKeyInfo and the refusal of a self-signed
# authority; ring hashes that key into a pin, the crypto rustls already runs on. Both are in the lock already.
rustls-webpki = { version = "0.103.17", default-features = false, features = ["alloc"] }
ring.workspace = true
# Files over HTTP on the socket's port: tokio's own HTTP stack (MIT); tokio-rustls is the TLS the socket's library
# rides on, so a file's request is under the same `Trust`.
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }

[features]
# Lets another crate's tests act as if a server had not offered a feature word.
testing = []

[dev-dependencies]
hyper = { workspace = true, features = ["server", "http1"] }
# A test server's self-signed certificate, the version the server's lock has.
rcgen = { workspace = true, features = ["crypto", "ring"] }
tokio = { workspace = true, features = ["test-util", "rt", "macros", "time", "net"] }

[lints]
workspace = true
