name: Windows build
description: >-
  What a Windows build of the client needs beyond the runner's Visual Studio, for the gate and the setup alike: the
  gate's tools, MSYS2's tools for FFmpeg's build, pkg-config for Rust's, and the native dependencies of this tree's
  recipes, restored or built.
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
    - name: MSYS2's tools for FFmpeg's build, and pkg-config for Rust's
      shell: bash
      run: |
        C:/msys64/usr/bin/pacman -S --noconfirm --needed make nasm pkgconf diffutils
        choco install pkgconfiglite --version 0.28 -y --no-progress
    # Each key is its recipes' own digest (FFmpeg's names every file it builds from), so no list of them is kept here.
    - id: recipe
      shell: bash
      run: |
        deps=$(scripts/deps/ffmpeg-windows.sh --recipe; sha256sum --text scripts/deps/python-tools.txt)
        echo "deps=$(sha256sum <<< "$deps" | cut -c1-32)" >> "$GITHUB_OUTPUT"
        echo "webrtc=$(sha256sum --text scripts/deps/webrtc.sh | cut -c1-32)" >> "$GITHUB_OUTPUT"
    # The Windows half of the builder image, built once per recipe and saved as soon as it is built: a cache saved at
    # the job's end is saved only when every later step passed.
    - id: deps
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          build/deps
          build/deps-src/wheels
        key: windows-deps-${{ steps.recipe.outputs.deps }}
    - name: Build FFmpeg, which the cache did not hold
      if: steps.deps.outputs.cache-hit != 'true'
      shell: bash
      run: scripts/deps/ffmpeg-windows.sh
    - if: steps.deps.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          build/deps
          build/deps-src/wheels
        key: windows-deps-${{ steps.recipe.outputs.deps }}
    # The engine's download, which the build fetches later: saved at the end of a job that passed.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build/deps-src/webrtc/download
        key: windows-webrtc-${{ steps.recipe.outputs.webrtc }}
