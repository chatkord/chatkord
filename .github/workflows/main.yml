name: main

# What reaches main is released only once the commit's tree is one CI's gate passed (scripts/ci/gated.py: no run, only
# the results of the pull request's). release-please keeps a release pull request open from the Conventional Commits
# on main; merging it tags `v<version>`, and the client's packages are built from the commit the release names, then
# attached to its GitHub Release with their sums and the update manifest, signed by sign.yml with the `release`
# environment's key.
# A tag pushed with GITHUB_TOKEN starts no workflow, which is why the packages are
# jobs here and not workflows of their own.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One run per push, in order: a release must not be made by a run that a newer push has overtaken.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  # The update channel a package is built with: the latest release's own assets.
  CHATKORD_UPDATES: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/

jobs:
  gated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
      - run: python3 scripts/ci/gated.py "$GITHUB_SHA"

  # Keeps the release pull request open; it never tags.
  release-pr:
    needs: gated
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-release: true

  # Tags a merged release pull request, only once this push is gated: a tag is never moved.
  release:
    needs: gated
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
          skip-github-pull-request: true
      # The release must name the commit this run is gated on.
      - name: Check the release's commit
        if: steps.release.outputs.release_created == 'true'
        env:
          TAGGED: ${{ steps.release.outputs.sha }}
        run: |
          if [[ "$TAGGED" != "$GITHUB_SHA" ]]; then echo "::error::the release tags $TAGGED, this run is $GITHUB_SHA"; exit 1; fi

  builder:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/builder.yml
    permissions:
      contents: read
      packages: write

  # Each package waits for the release, which is checked to name this run's commit.
  package-linux:
    needs: [builder, release]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    env:
      CHATKORD_CONTAINER: docker
      BUILDER: ${{ needs.builder.outputs.image }}
    steps:
      # Every tag: a package carries the release's version, and names it as its source, only at the release's tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - name: Free the runner's disk
        run: scripts/ci/free-disk.sh
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the AppImage in the builder
        run: CHATKORD_BUILDER="${BUILDER%:*}" scripts/package/linux.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-linux
          path: build/package/*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  package-windows:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/windows-build
      - name: Build the setup
        run: scripts/package/windows.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-windows
          path: build/package/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # The update manifest of both packages, written by the client's own writer in the builder; no key is in this job.
  manifest:
    needs: [release, builder, package-linux, package-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ needs.release.outputs.tag }}
      CHATKORD_CONTAINER: docker
      BUILDER: ${{ needs.builder.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Write the update manifest
        run: |
          version="${TAG#v}"
          shopt -s nullglob
          appimage=(dist/*-"$version"-x86_64.AppImage) setup=(dist/*-"$version".exe)
          if (( ${#appimage[@]} != 1 || ${#setup[@]} != 1 )); then
            echo "::error::the packages are not one AppImage and one setup of $version: $(cd dist && echo *)"; exit 1
          fi
          mkdir manifest
          # shellcheck disable=SC2016 # expanded by the builder's bash
          CHATKORD_BUILDER="${BUILDER%:*}" scripts/ci/builder.sh run bash -c \
            'cargo build --locked --manifest-path client/Cargo.toml -p update --bin release-manifest &&
             "$CARGO_TARGET_DIR/debug/release-manifest" --version "$1" --out manifest "$2" "$3"' \
            _ "$version" "${appimage[0]}" "${setup[0]}"
          cat manifest/latest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest
          path: manifest/latest.json
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: [release, manifest]
    uses: ./.github/workflows/sign.yml
    permissions:
      contents: read
    with:
      environment: release
      tag: ${{ needs.release.outputs.tag }}

  # The packages, their sums and the signed manifest attached to the release; a client reads the manifest, then its
  # signature, so the signature is there first.
  publish-client:
    needs: [release, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist
      - name: Attach the packages, their sums and the signed manifest
        run: |
          shopt -s nullglob
          packages=(dist/*.AppImage dist/*.exe)
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "${packages[@]}" dist/SHA256SUMS
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/latest.json.sig
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/latest.json

  # The release commit (version.txt, CHANGELOG.md) lands on main only; a pull request brings it to develop.
  sync:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `gh pr create` reads the repository before it opens the pull request.
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Open main -> develop
        run: |
          gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head main \
            --title "chore: bring $TAG to develop" \
            --body "Merges the release commit of $TAG (version.txt, CHANGELOG.md) back into develop. Merge with a merge commit."
